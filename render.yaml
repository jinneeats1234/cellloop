# Render Blueprint for CellLoop: ONE free web service that runs the whole app
# (React web app + FastAPI API) from the Dockerfile at the repository root.
# Render rebuilds and redeploys automatically on every push to main.
#
# Deploy: render.com → New → Blueprint → choose this repository → Apply.
services:
  - type: web
    name: cellloop
    runtime: docker
    plan: free
    region: ohio
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Demo mode: sign in with the built-in demo accounts; fictional data only.
      # (APP_ENV=prod requires Amazon Cognito, PostgreSQL and S3; see docs/deployment-aws.md.)
      - key: APP_ENV
        value: dev
      - key: LLM_PROVIDER
        value: mock
      # Random secret for signing demo sign-in tokens, generated by Render.
      - key: DEV_JWT_SECRET
        generateValue: true
